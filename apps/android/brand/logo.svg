<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 640" width="512" height="640">
  <defs>
    <linearGradient id="shieldGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d1526"/>
      <stop offset="100%" stop-color="#0b1220"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#2563eb" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="640" rx="48" fill="url(#bgGrad)"/>

  <!-- Subtle grid pattern -->
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
    <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#1e3a5f" stroke-width="0.5" opacity="0.15"/>
  </pattern>
  <rect width="512" height="640" rx="48" fill="url(#grid)"/>

  <!-- Shield group — centered, large -->
  <g transform="translate(256, 240)" filter="url(#shadow)">
    <!-- Shield shape (scaled up from favicon) -->
    <path d="M0 -150c30 25.6 71 43.8 108 43.8V-42c0 70.9-47.3 118.1-108 145.1C-47.3 76.1-108 3.1-108-42V-106.2C-69.5-106.2-30-123.8 0-150z"
          fill="url(#shieldGrad)" stroke="#93c5fd" stroke-width="3" stroke-linejoin="round"/>

    <!-- Inner glow on shield -->
    <path d="M0 -130c24 20.5 57 35 86 35V-38c0 56.7-37.8 94.5-86 116C-37.8 56.5-86-18.7-86-38V-95C-57-95-24-109.5 0-130z"
          fill="none" stroke="#93c5fd" stroke-width="0.8" opacity="0.3"/>

    <!-- Checkmark -->
    <path d="M-54 10 L-14 50 L62 -30"
          fill="none" stroke="#ffffff" stroke-width="12"
          stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  </g>

  <!-- "KRYDO" text -->
  <text x="256" y="490" text-anchor="middle"
        font-family="'Inter', 'SF Pro Display', 'Segoe UI', system-ui, -apple-system, sans-serif"
        font-size="72" font-weight="700" letter-spacing="12"
        fill="#ffffff">KRYDO</text>

  <!-- Tagline -->
  <text x="256" y="535" text-anchor="middle"
        font-family="'Inter', 'SF Pro Display', 'Segoe UI', system-ui, -apple-system, sans-serif"
        font-size="20" font-weight="400" letter-spacing="4"
        fill="#93c5fd" opacity="0.7">PRIVACY INFRASTRUCTURE</text>
</svg>
